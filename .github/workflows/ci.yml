name: CI & Self-Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 6 * * *' # Daily automated health check at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Unit Tests & Cross-Python Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Test CLI Installation
        run: |
          pip install .
          sitehealth --help

  live-health-check:
    name: Live Deployment Verification & SSL Sentinel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Live Endpoints & Output GitHub Step Summary
        id: health_audit
        run: |
          python sitehealth.py https://aviperera.com -p / -p /ai/ -p /law/ -p /tech/ -p /projects/ -p /blog/ --format markdown | tee audit_report.md
          cat audit_report.md >> $GITHUB_STEP_SUMMARY

      - name: Create Alert Issue on Degradation
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 Site Health Incident: aviperera.com degraded or failed health check" \
            --body "The scheduled Site Health Verifier workflow detected an outage, degraded endpoint, or SSL certificate anomaly on https://aviperera.com. Please check the workflow run logs for full latency metrics and findings." \
            --label "bug" || true
