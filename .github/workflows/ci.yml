name: CI & Self-Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 6 * * *' # Daily automated health check

jobs:
  test:
    name: Unit Tests & Cross-Python Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Test CLI Installation
        run: |
          pip install .
          sitehealth --help

  live-health-check:
    name: Live Deployment Verification Example
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Live Endpoints & Output GitHub Step Summary
        run: |
          python sitehealth.py https://aviperera.com -p / -p /ai/ -p /law/ -p /tech/ -p /projects/ -p /blog/ --format markdown >> $GITHUB_STEP_SUMMARY
